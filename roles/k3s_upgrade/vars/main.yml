---
# vars file for k3s_upgrade
# k3s_channel, k3s_master and k3s_worker (install flags) are loaded at
# runtime from roles/k3s_install/vars/main.yml, so the exec flags used to
# reinstall the k3s binary stay in sync with a fresh install.
#
# The version to upgrade to is NOT read from k3s_install - it must be set
# explicitly via k3s_upgrade_version (see defaults/main.yml) so an upgrade
# never silently jumps to "latest".
