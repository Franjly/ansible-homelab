---
- name: Create namespace "{{ apps.peanut.namespace }}"
  become: false
  kubernetes.core.k8s:
    name: "{{ apps.peanut.namespace }}"
    kind: Namespace
    state: present
  delegate_to: localhost

- name: Pause 3 minutes before restore peanut volume backup
  ansible.builtin.pause:
    minutes: 3

- name: Get list of peanut volume backups
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/backupvolumes/{{ apps.peanut.volume_name }}?action=backupList"
    method: POST
    validate_certs: false
  register: backup_list
  delegate_to: localhost
  run_once: true

- name: Get latest backup
  ansible.builtin.set_fact:
    backup_id: "{{ backup_list | json_query('json.data[*].{created: created, id: id}') | sort(attribute='created') | reverse | json_query('[0].id') }}"

- name: Restore peanut volume backup from longhorn
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/volumes"
    method: POST
    body: >-
      {
        "name":"{{ apps.peanut.volume_name }}",
        "numberOfReplicas":3,
        "accessMode":"rwo",
        "encrypted":false,
        "nodeSelector":[],
        "diskSelector":[],
        "fromBackup":"s3://longhorn-backups@us-east-1/?backup={{ backup_id }}&volume={{ apps.peanut.volume_name }}",
        "staleReplicaTimeout":20
      }
    body_format: json
    validate_certs: false
  delegate_to: localhost

- name: Pause 1 minutes to restore peanut volume backup
  ansible.builtin.pause:
    minutes: 1

- name: Create PV peanut
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/volumes/{{ apps.peanut.volume_name }}?action=pvCreate"
    method: POST
    body: '{"pvName":"{{ apps.peanut.volume_name }}","fsType":"ext4"}'
    body_format: json
    validate_certs: false
  delegate_to: localhost

- name: Create PVC peanut
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/volumes/{{ apps.peanut.volume_name }}?action=pvcCreate"
    method: POST
    body: '{"namespace":"{{ apps.peanut.namespace }}","pvcName":"{{ apps.peanut.pvc_name }}"}'
    body_format: json
    validate_certs: false
  delegate_to: localhost

- name: Deploy peanut
  become: false
  kubernetes.core.k8s:
    state: present
    src: "{{ item }}"
  with_items:
    - '{{ playbook_dir }}/k3s-apps-install/files/argocd-homelab-pi-k3s/apps/peanut/project/peanut.yaml'
    - '{{ playbook_dir }}/k3s-apps-install/files/argocd-homelab-pi-k3s/apps/peanut/application/peanut.yaml'
  delegate_to: localhost

- name: Pause 1 minutes to deploy peanut
  ansible.builtin.pause:
    minutes: 1

- name: Wait for peanut pod to be running
  become: false
  ansible.builtin.command: kubectl get pods -n peanut -o json
  register: kubectl_get_pods_peanut
  until: kubectl_get_pods_peanut.stdout|from_json|json_query('items[*].status.phase')|unique == ["Running"]
  retries: 10
  delay: 30
  changed_when: true
  delegate_to: localhost
