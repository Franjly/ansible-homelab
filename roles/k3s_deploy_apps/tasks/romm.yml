---
- name: Create namespace "{{ apps.romm.namespace }}"
  become: false
  kubernetes.core.k8s:
    name: "{{ apps.romm.namespace }}"
    kind: Namespace
    state: present
  delegate_to: localhost

- name: Get list of romm apps volume backups
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/backupvolumes/{{ item.volume_name }}?action=backupList"
    method: POST
    validate_certs: false
  register: backup_list
  loop: "{{ apps.romm.volumes }}"
  loop_control:
    loop_var: item
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Initialize list with recent backupsId
  ansible.builtin.set_fact:
    recent_backup_ids: []
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Filter elements data
  ansible.builtin.set_fact:
    filtered_results: "{{ backup_list.results | selectattr('json.data') | list }}"
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Create list with recents backupID for al the romm apps
  ansible.builtin.set_fact:
    recent_backup_ids: >-
      {{
        recent_backup_ids +
        [
          item
          | json_query('json.data[*].{created: created, id: id}')
          | sort(attribute='created')
          | reverse
          | json_query('[0].id')
        ]
      }}
  loop: "{{ filtered_results }}"
  loop_control:
    loop_var: item
  when:
    - apps.romm.volumes is defined
    - item.changed is false
    - item.json.data is defined
  delegate_to: localhost

- name: Show recent_backup_ids
  ansible.builtin.debug:
    var: recent_backup_ids
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Restore each romm app volume backup
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/volumes"
    method: POST
    body: >-
      {
        "name":"{{ item.volume_name }}",
        "numberOfReplicas":2,
        "accessMode":"rwo",
        "encrypted":false,
        "nodeSelector":[],
        "diskSelector":[],
        "fromBackup":"s3://longhorn-backups@us-east-1/?backup={{ recent_backup_ids[index] }}&volume={{ item.volume_name }}",
        "staleReplicaTimeout":20
      }
    body_format: json
    validate_certs: false
  loop: "{{ apps.romm.volumes }}"
  loop_control:
    loop_var: item
    index_var: index
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Pause 1 minutes to restore romm volume backup
  ansible.builtin.pause:
    minutes: 1
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Create PV romm
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/volumes/{{ item.volume_name }}?action=pvCreate"
    method: POST
    body: '{"pvName":"{{ item.volume_name }}","fsType":"ext4"}'
    body_format: json
    validate_certs: false
  with_items: "{{ apps.romm.volumes }}"
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Create PVC romm
  become: false
  ansible.builtin.uri:
    url: "{{ apps.longhorn.base_url }}/v1/volumes/{{ item.volume_name }}?action=pvcCreate"
    method: POST
    body: '{"namespace":"{{ apps.romm.namespace }}","pvcName":"{{ item.pvc_name }}"}'
    body_format: json
    validate_certs: false
  with_items: "{{ apps.romm.volumes }}"
  when: apps.romm.volumes is defined
  delegate_to: localhost

- name: Deploy romm
  become: false
  kubernetes.core.k8s:
    state: present
    src: "{{ item }}"
  with_items:
    - '{{ playbook_dir }}/k3s-apps-install/files/argocd-homelab-pi-k3s/apps/romm/project/romm.yaml'
    - '{{ playbook_dir }}/k3s-apps-install/files/argocd-homelab-pi-k3s/apps/romm/application/romm.yaml'
  delegate_to: localhost

- name: Pause 30 seconds to deploy romm
  ansible.builtin.pause:
    seconds: 30
  delegate_to: localhost

- name: Wait for romm pods to be running
  become: false
  ansible.builtin.command: kubectl get pods -n romm -o json
  register: kubectl_get_pods_romm
  until: kubectl_get_pods_romm.stdout|from_json|json_query('items[*].status.phase')|unique == ["Running"]
  retries: 10
  delay: 30
  changed_when: true
  delegate_to: localhost
